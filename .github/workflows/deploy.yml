name: CI/CD sentiment-api-only

on:
  push:
    branches: [api-only]
  pull_request:
    branches: [api-only]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source
      - uses: actions/checkout@v3

      # Étape 2 : Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Étape 3 : Installer Poetry
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Étape 4 : Installer les dépendances avec Poetry
      - name: Install dependencies
        run: |
          poetry install --no-root

      # Vérifier que le fichier main.py existe
      - name: Check for main.py
        run: |
          if [ ! -f "app/main.py" ]; then
            echo "main.py not found!"
            exit 1
          fi

      # Étape 5 : Créer le fichier startup.txt pour Azure
      - name: Create startup command
        run: echo "poetry run python -m uvicorn app.main:app --host 0.0.0.0 --port 8000" > startup.txt

      # Étape 6 : Se connecter à Azure avec OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Étape 7 : Déployer sur Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentiment-api-only
          slot-name: production
          startup-command: 'poetry run python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'
