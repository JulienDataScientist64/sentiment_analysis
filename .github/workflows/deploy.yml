name: CI/CD sentiment-api-only

on:
  push:
    branches: [ api-only ]
  pull_request:
    branches: [ api-only ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source
      - uses: actions/checkout@v3

      # Étape 2 : Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Étape 3 : Créer un environnement virtuel
      - name: Create virtual environment
        run: python -m venv antenv

      # Étape 4 : Activer l'environnement virtuel et installer les dépendances
      - name: Install dependencies
        run: |
          source antenv/bin/activate
          pip install -r requirements.txt

      # Étape 5 : Lancer les tests avec pytest
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: poetry run pytest

      # Étape 6 : Se connecter à Azure avec OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Étape 7 : Créer le fichier startup.txt
      - name: Create startup command
        run: echo "source antenv/bin/activate && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000" > startup.txt

      # Étape 8 : Déployer sur Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentiment-api-only
          slot-name: production
          startup-command: 'source antenv/bin/activate && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'
